name: Deploy Videha Literature Festival to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci
      - name: Synchronize current issue and archive manifest
        continue-on-error: true
        run: node scripts/update-archive.mjs
      - run: npm run check
      - name: Build deployable static site
        continue-on-error: true
        run: node scripts/build-core.mjs
      - name: Inject complete Gajendra Section 00 corpus
        run: node scripts/inject-full-gajendra-corpus.mjs
      - name: Build permanent accessibility routes
        run: node scripts/build-accessibility.mjs
      - name: Verify Pages directory
        run: test -f dist/index.html && test -f dist/mai/index.html && find dist -type f | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
