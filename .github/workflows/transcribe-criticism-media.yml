name: Build Videha criticism ASR drafts

on:
  push:
    branches: [main]
    paths:
      - scripts/transcribe_criticism_media.py
      - scripts/merge_criticism_transcripts.py
      - .github/workflows/transcribe-criticism-media.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: criticism-asr-${{ github.ref }}
  cancel-in-progress: true

env:
  ASR_RELEASE: criticism-transcripts-v1
  ASR_MODEL: small
  SHARD_COUNT: '192'

jobs:
  cancel-obsolete:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel older ASR runs from the pre-concurrency workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for status in in_progress queued; do
            gh run list --repo "$GH_REPO" --workflow transcribe-criticism-media.yml --status "$status" --limit 100 --json databaseId --jq '.[].databaseId' |
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
              echo "Cancelling obsolete ASR run $run_id"
              gh run cancel "$run_id" --repo "$GH_REPO" || true
            done
          done

  smoke:
    needs: cancel-obsolete
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ASR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check 'faster-whisper>=1.1,<2'
      - name: Select the smallest real canonical recording for smoke testing
        run: |
          mkdir -p asr-smoke
          python - <<'PY'
          import json
          src='public/data/criticism-transcript-inventory.json'
          dst='asr-smoke/inventory.json'
          data=json.load(open(src,encoding='utf-8'))
          choices=[]
          for collection in data.get('collections',[]):
              for item in collection.get('canonicalMedia',[]):
                  size=int(item.get('selectedBytes') or 0)
                  if size > 0:
                      choices.append((size, collection, item))
          assert choices, 'No canonical recording available for smoke test'
          size, collection, item=min(choices,key=lambda row: row[0])
          smoke={
              'schemaVersion': data.get('schemaVersion'),
              'generated': data.get('generated'),
              'summary': {'canonicalRecordings': 1},
              'collections': [{
                  'part': collection['part'],
                  'identifier': collection['identifier'],
                  'title': collection.get('title',''),
                  'canonicalMedia': [item]
              }]
          }
          json.dump(smoke,open(dst,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print({'part':collection['part'],'name':item['selectedName'],'bytes':size})
          PY
      - name: Transcribe one real Internet Archive recording
        run: |
          python scripts/transcribe_criticism_media.py \
            --inventory asr-smoke/inventory.json \
            --shard-index 0 \
            --shard-count 1 \
            --limit 1 \
            --model "$ASR_MODEL" \
            --out asr-smoke/asr-shard-000.json
      - name: Enforce provenance and review-state boundaries
        run: |
          python - <<'PY'
          import json
          d=json.load(open('asr-smoke/asr-shard-000.json',encoding='utf-8'))
          assert d['selectedCount'] == 1, d
          assert d['coveredCount'] == 1, d
          assert d['failureCount'] == 0, d
          r=d['records'][0]
          assert r['status'] in {'asr-draft','no-speech-detected'}, r
          assert r['humanVerified'] is False, r
          assert r['editorialReview'] == 'not-reviewed', r
          if r['status'] == 'asr-draft':
              assert r.get('plainText','').strip(), r
              assert r.get('segments'), r
          print({k:r.get(k) for k in ('id','part','status','detectedLanguage','languageProbability','durationSeconds')})
          PY
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criticism-asr-smoke
          path: |
            asr-smoke/inventory.json
            asr-smoke/asr-shard-000.json
          if-no-files-found: warn
          retention-days: 7

  prepare:
    needs: smoke
    runs-on: ubuntu-24.04
    outputs:
      expected: ${{ steps.count.outputs.expected }}
      matrix: ${{ steps.count.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: count
        name: Read canonical corpus size and construct shard matrix
        run: |
          COUNT=$(python - <<'PY'
          import json
          d=json.load(open('public/data/criticism-transcript-inventory.json',encoding='utf-8'))
          print(int(d['summary']['canonicalRecordings']))
          PY
          )
          MATRIX=$(python - <<'PY'
          import json, os
          print(json.dumps(list(range(int(os.environ['SHARD_COUNT']))), separators=(',',':')))
          PY
          )
          echo "expected=$COUNT" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          test "$COUNT" = '2346'
      - name: Create or retain transcript-draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES='Machine-generated ASR accessibility aids for the twelve Videha Discussion & Criticism Internet Archive collections. Spoken-text records are machine transcript drafts; no-speech records mean the ASR pass emitted no speech text. These are not publisher captions and are not human/editorially verified transcripts. Every record retains source URL, model, timestamps/language evidence where available, and review-required state.'
          if gh release view "$ASR_RELEASE" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$ASR_RELEASE" --repo "$GH_REPO" --title 'Videha Discussion & Criticism ASR Accessibility Aids' --notes "$NOTES"
          else
            gh release create "$ASR_RELEASE" --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'Videha Discussion & Criticism ASR Accessibility Aids' --notes "$NOTES"
          fi

  transcribe:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ASR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check 'faster-whisper>=1.1,<2'
      - id: asr
        name: Transcribe shard ${{ matrix.shard }}
        continue-on-error: true
        run: |
          mkdir -p asr
          PAD=$(printf '%03d' '${{ matrix.shard }}')
          python scripts/transcribe_criticism_media.py \
            --inventory public/data/criticism-transcript-inventory.json \
            --shard-index '${{ matrix.shard }}' \
            --shard-count "$SHARD_COUNT" \
            --model "$ASR_MODEL" \
            --out "asr/asr-shard-$PAD.json"
      - name: Persist shard on release
        if: always() && hashFiles('asr/asr-shard-*.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$ASR_RELEASE" asr/asr-shard-*.json --clobber --repo "$GH_REPO"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr-shard-${{ matrix.shard }}
          path: asr/asr-shard-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce complete shard transcription
        if: steps.asr.outcome == 'failure'
        run: exit 1

  finalize:
    if: always()
    needs: [prepare, transcribe]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download persisted shard manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p downloaded final
          gh release download "$ASR_RELEASE" --repo "$GH_REPO" --pattern 'asr-shard-*.json' --dir downloaded
      - id: merge
        name: Merge ASR corpus and enforce coverage
        continue-on-error: true
        run: |
          python scripts/merge_criticism_transcripts.py --input downloaded --out final --require-complete
      - name: Publish per-part transcript datasets and corpus manifest
        if: always() && hashFiles('final/criticism-transcript-manifest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$ASR_RELEASE" final/criticism-transcripts-part-*.json final/criticism-transcript-manifest.json --clobber --repo "$GH_REPO"
      - name: Publish completion summary into repository
        if: steps.merge.outcome == 'success'
        run: |
          cp final/criticism-transcript-manifest.json public/data/criticism-transcript-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/criticism-transcript-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish complete criticism ASR transcript manifest [skip asr]'
          git push
      - name: Enforce complete corpus
        if: steps.merge.outcome == 'failure'
        run: exit 1
