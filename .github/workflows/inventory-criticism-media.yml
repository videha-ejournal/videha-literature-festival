name: Inventory Videha criticism media for transcripts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/inventory_criticism_media.py
      - .github/workflows/inventory-criticism-media.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Internet Archive inventory
        run: python scripts/inventory_criticism_media.py
      - name: Validate inventory
        run: |
          python - <<'PY'
          import json
          p='public/data/criticism-transcript-inventory.json'
          d=json.load(open(p,encoding='utf-8'))
          s=d['summary']
          print(s)
          assert s['collectionsRead'] == 12, s
          assert s['failures'] == 0, s
          assert s['mediaFiles'] > 0, s
          assert s['canonicalRecordings'] > 0, s
          PY
      - name: Commit refreshed inventory
        run: |
          if [ -z "$(git status --porcelain -- public/data/criticism-transcript-inventory.json)" ]; then
            echo 'Inventory unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/criticism-transcript-inventory.json
          git commit -m 'Refresh criticism transcript source inventory [skip ci]'
          git pull --rebase origin main
          git push
