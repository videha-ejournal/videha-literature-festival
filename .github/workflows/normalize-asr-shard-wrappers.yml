name: Normalize legacy ASR shard wrappers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-asr-shard-wrappers.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  ASR_RELEASE: criticism-transcripts-v1
  SHARD_COUNT: '192'
  EXPECTED_TOTAL: '2346'

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all canonical shard assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p original normalized before-upload final-local final-release
          gh release download "$ASR_RELEASE" --repo "$GH_REPO" --pattern 'asr-shard-*.json' --dir original
          test "$(find original -maxdepth 1 -type f -name 'asr-shard-*.json' | wc -l | tr -d ' ')" = "$SHARD_COUNT"

      - name: Re-certify wrappers from canonical inventory without changing record payloads
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          SHARD_COUNT=int(os.environ['SHARD_COUNT'])
          EXPECTED_TOTAL=int(os.environ['EXPECTED_TOTAL'])
          VALID={'asr-draft','no-speech-detected'}
          src=Path('original')
          dst=Path('normalized')
          dst.mkdir(exist_ok=True)

          inventory=json.loads(Path('public/data/criticism-transcript-inventory.json').read_text(encoding='utf-8'))
          rows=[]
          for collection in inventory.get('collections',[]):
              part=int(collection['part'])
              for item in collection.get('canonicalMedia',[]):
                  rows.append({'part':part,'identifier':collection['identifier'],'collectionTitle':collection.get('title',''),**item})
          rows=sorted(rows,key=lambda row:(row['part'],str(row['logicalSource']).lower()))
          assert len(rows)==EXPECTED_TOTAL, len(rows)

          def stable_id(row):
              part=int(row['part']); logical=str(row['logicalSource'])
              return f"p{part:02d}-{hashlib.sha1(f'{part}|{logical}'.encode('utf-8')).hexdigest()[:14]}"

          expected_by_shard={i:[] for i in range(SHARD_COUNT)}
          for index,row in enumerate(rows):
              expected_by_shard[index % SHARD_COUNT].append(row)

          changed=[]
          report=[]
          all_ids=[]
          all_urls=[]
          for shard_index in range(SHARD_COUNT):
              path=src/f'asr-shard-{shard_index:03d}.json'
              assert path.exists(), path
              data=json.loads(path.read_text(encoding='utf-8'))
              records=data.get('records')
              assert isinstance(records,list) and records, f'shard {shard_index}: missing records'
              expected_rows=expected_by_shard[shard_index]
              expected_ids=[stable_id(row) for row in expected_rows]
              expected_url_by_id={stable_id(row):str(row.get('selectedUrl') or '') for row in expected_rows}
              actual_ids=[str(r.get('id') or '') for r in records]
              assert len(records)==len(expected_rows), f'shard {shard_index}: count {len(records)} != {len(expected_rows)}'
              assert len(set(actual_ids))==len(actual_ids), f'shard {shard_index}: duplicate record id'
              assert set(actual_ids)==set(expected_ids), f'shard {shard_index}: id set mismatch'
              for record in records:
                  rid=str(record.get('id') or '')
                  assert record.get('status') in VALID, f'{rid}: invalid status {record.get("status")}'
                  assert record.get('humanVerified') is False, f'{rid}: humanVerified must remain false'
                  assert record.get('editorialReview')=='not-reviewed', f'{rid}: editorialReview must remain not-reviewed'
                  assert str(record.get('mediaUrl') or '')==expected_url_by_id[rid], f'{rid}: canonical media URL mismatch'

              # This digest proves that only the shard wrapper is normalized; record objects are untouched.
              records_digest_before=hashlib.sha256(json.dumps(records,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')).hexdigest()
              normalized=dict(data)
              draft_count=sum(r.get('status')=='asr-draft' for r in records)
              no_speech_count=sum(r.get('status')=='no-speech-detected' for r in records)
              runtime=normalized.get('runtimeProvenance')
              if not isinstance(runtime,dict):
                  runtime={}
              if not runtime:
                  runtime_candidates=[r.get('asrRuntime') for r in records if isinstance(r.get('asrRuntime'),dict)]
                  if runtime_candidates:
                      first=runtime_candidates[0]
                      if all(candidate==first for candidate in runtime_candidates):
                          runtime=dict(first)
              model=str(normalized.get('asrModel') or '')
              if not model:
                  models={str(r.get('asrModel') or '') for r in records if str(r.get('asrModel') or '')}
                  assert len(models)<=1, f'shard {shard_index}: mixed ASR models {models}'
                  model=next(iter(models),'small')

              normalized.update({
                  'schemaVersion':4,
                  'inventoryGenerated':inventory.get('generated'),
                  'asrModel':model or 'small',
                  'shardIndex':shard_index,
                  'shardCount':SHARD_COUNT,
                  'canonicalRecordingCount':EXPECTED_TOTAL,
                  'selectedCount':len(expected_rows),
                  'draftCount':draft_count,
                  'noSpeechCount':no_speech_count,
                  'coveredCount':draft_count+no_speech_count,
                  'failureCount':0,
                  'checkpoint':False,
                  'completeShard':True,
                  'runtimeProvenance':runtime,
                  'records':records,
              })
              assert normalized['coveredCount']==len(records)
              records_digest_after=hashlib.sha256(json.dumps(normalized['records'],ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')).hexdigest()
              assert records_digest_before==records_digest_after, f'shard {shard_index}: record payload changed'
              out=dst/path.name
              out.write_text(json.dumps(normalized,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

              wrapper_was_current=(
                  data.get('schemaVersion')==4
                  and data.get('completeShard') is True
                  and data.get('checkpoint') is False
                  and int(data.get('failureCount',-1))==0
                  and int(data.get('selectedCount',-1))==len(records)
                  and int(data.get('coveredCount',-1))==len(records)
                  and int(data.get('shardIndex',-1))==shard_index
                  and int(data.get('shardCount',0))==SHARD_COUNT
                  and int(data.get('canonicalRecordingCount',0))==EXPECTED_TOTAL
              )
              if not wrapper_was_current:
                  changed.append(shard_index)
              report.append({
                  'shard':shard_index,
                  'records':len(records),
                  'recordPayloadSha256':records_digest_before,
                  'wrapperAlreadyCurrent':wrapper_was_current,
              })
              all_ids.extend(actual_ids)
              all_urls.extend(str(r.get('mediaUrl') or '') for r in records)

          assert len(all_ids)==EXPECTED_TOTAL and len(set(all_ids))==EXPECTED_TOTAL
          assert len(all_urls)==EXPECTED_TOTAL and len(set(all_urls))==EXPECTED_TOTAL
          expected_changed=set(range(SHARD_COUNT))-{36,37,42,43,44,75}
          assert set(changed)==expected_changed, f'unexpected legacy-wrapper set: {changed}'
          Path('normalized/wrapper-normalization-report.json').write_text(json.dumps({
              'schemaVersion':1,
              'operation':'wrapper-only canonical re-certification; no ASR rerun',
              'canonicalRecordings':EXPECTED_TOTAL,
              'canonicalShards':SHARD_COUNT,
              'normalizedLegacyShardCount':len(changed),
              'unchangedCurrentShardCount':SHARD_COUNT-len(changed),
              'normalizedShardIndexes':changed,
              'recordsPreserved':True,
              'humanVerifiedChanged':False,
              'editorialReviewChanged':False,
              'shards':report,
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/changed-shards.txt').write_text('\n'.join(f'asr-shard-{i:03d}.json' for i in changed)+'\n',encoding='utf-8')
          print({'normalizedLegacyShardCount':len(changed),'unchangedCurrentShardCount':SHARD_COUNT-len(changed),'records':len(all_ids)})
          PY

      - name: Prove normalized set passes strict merger before publishing any replacement
        run: |
          set -euo pipefail
          python scripts/merge_criticism_transcripts.py \
            --input normalized \
            --inventory public/data/criticism-transcript-inventory.json \
            --out before-upload \
            --require-complete
          python - <<'PY'
          import json
          d=json.load(open('before-upload/criticism-transcript-manifest.json',encoding='utf-8'))
          assert d['records']==2346 and d['coveredRecords']==2346
          assert d['shardsPresent']==192 and d['shardsExpected']==192
          assert d['missingShards']==[] and d['invalidCanonicalShards']==[]
          assert d['duplicateCanonicalMediaUrlCount']==0
          assert d['missingCanonicalMediaUrlCount']==0
          assert d['extraCanonicalMediaUrlCount']==0
          assert d['complete'] is True
          print({'prePublishStrictGate':'passed','records':d['records'],'shards':d['shardsPresent'],'complete':d['complete']})
          PY

      - name: Publish only the 186 validated legacy wrapper replacements
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          published=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            ok=0
            for attempt in 1 2 3; do
              if gh release upload "$ASR_RELEASE" "normalized/$name" --clobber --repo "$GH_REPO"; then
                ok=1
                break
              fi
              sleep $((attempt * 2))
            done
            [ "$ok" = 1 ] || { echo "Failed to publish $name" >&2; exit 1; }
            published=$((published+1))
          done < /tmp/changed-shards.txt
          test "$published" = '186'
          echo "Published $published validated wrapper-only replacements."

      - name: Re-download release and enforce strict production gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-verified
          gh release download "$ASR_RELEASE" --repo "$GH_REPO" --pattern 'asr-shard-*.json' --dir release-verified
          test "$(find release-verified -maxdepth 1 -type f -name 'asr-shard-*.json' | wc -l | tr -d ' ')" = '192'
          python scripts/merge_criticism_transcripts.py \
            --input release-verified \
            --inventory public/data/criticism-transcript-inventory.json \
            --out final-release \
            --require-complete
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('final-release/criticism-transcript-manifest.json').read_text(encoding='utf-8'))
          required={
              'records':2346,
              'expectedTotal':2346,
              'coveredRecords':2346,
              'shardsPresent':192,
              'shardsExpected':192,
              'missingShards':[],
              'invalidCanonicalShards':[],
              'duplicateStableIds':[],
              'canonicalMediaUrlCount':2346,
              'inventoryMediaUrlCount':2346,
              'duplicateCanonicalMediaUrlCount':0,
              'missingCanonicalMediaUrlCount':0,
              'extraCanonicalMediaUrlCount':0,
              'inventoryComplete':True,
              'complete':True,
          }
          failures={k:(d.get(k),v) for k,v in required.items() if d.get(k)!=v}
          assert not failures, failures
          print(required)
          PY

      - name: Upload normalization and strict-gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asr-wrapper-normalization-and-final-gate
          path: |
            normalized/wrapper-normalization-report.json
            before-upload/criticism-transcript-manifest.json
            final-release/criticism-transcript-manifest.json
          retention-days: 30
